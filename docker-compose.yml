services:
  opencode-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    image: opencode-proxy:latest
    container_name: opencode-proxy
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
    environment:
      - TZ=Asia/Jakarta
      - OPENCODE_PROXY_HOST=0.0.0.0
      - OPENCODE_PROXY_PORT=20144
      - OPENCODE_PROXY_CONFIG=/app/state/config.json
    ports:
      - "20144:20144"
    volumes:
      - ./state:/app/state
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:20144/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
